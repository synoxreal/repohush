name: Bug report
description: Something did not work as expected.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the command and cleaned output. Never paste a real key.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RepoHush version
      placeholder: 0.2.5
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
